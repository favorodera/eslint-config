name: Bug Report
description: Report something that is broken or behaves unexpectedly
title: '[Bug]: '
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! A **reproduction** and the **version** you are using are what make a bug fixable. Everything else is optional.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal code snippet, repository, or clear steps to reproduce the issue.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The package and version you use, plus your eslint version.
      placeholder: 'e.g. @favorodera/eslint-config@x.y.z with ESLint 10'
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Browser, operating system, logs, screenshots, or anything else that might help.
    validations:
      required: false
